spring:
  # Local dev defaults so `./mvnw spring-boot:run` works with no extra flags.
  # (Postgres+PostGIS runs on host port 5433; env vars still override these.)
  datasource:
    # Local default is host port 5433; on Render the DB_HOST/DB_PORT/DB_NAME env
    # vars (wired from the managed Postgres) compose the real URL.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:rideswift}}
  jpa:
    properties:
      hibernate:
        format_sql: true

# Run on 8090 by default (host port 8080 is used by another container locally).
server:
  port: ${SERVER_PORT:8090}

# Seed a self-contained demo dataset on startup (idempotent). Dev/demo only.
rideswift:
  seed:
    enabled: true

logging:
  level:
    com.rideswift: DEBUG
    org.hibernate.SQL: DEBUG
